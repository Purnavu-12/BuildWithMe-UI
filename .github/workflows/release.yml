name: Package release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:install
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarballs
          path: .release/tarballs/*.tgz
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-tarballs
          path: .release
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish packages with npm provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          for package in .release/*.tgz; do
            pnpm publish "$package" --access public --provenance --no-git-checks
          done
