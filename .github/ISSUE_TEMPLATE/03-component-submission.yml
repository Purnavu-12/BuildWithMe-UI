name: 'Component submission'
description: 'Propose a component for review.'
labels: ['component', 'contribution', 'needs-triage']
body:
  - type: textarea
    id: field-1
    attributes:
      label: 'Name, description and product domain'
    validations:
      required: true
  - type: textarea
    id: field-2
    attributes:
      label: 'Creator, license and provenance type'
      description: 'Original work needs creator and license only. Adaptations and remixes also need their applicable source or parent details.'
    validations:
      required: true
  - type: textarea
    id: field-3
    attributes:
      label: 'Engine and dependencies'
    validations:
      required: true
  - type: textarea
    id: field-4
    attributes:
      label: 'React, Vue and Svelte behavior, usage and screenshots'
    validations:
      required: true
  - type: textarea
    id: field-5
    attributes:
      label: 'Reduced motion and accessibility notes'
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Community expectations
      options:
        - label: I agree to follow the project Code of Conduct.
          required: true
