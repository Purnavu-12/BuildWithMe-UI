name: 'Component request'
description: 'Suggest a reusable component.'
labels: ['component', 'enhancement', 'needs-triage']
body:
  - type: dropdown
    id: domain
    attributes:
      label: Product domain
      options:
        [
          Actions,
          Forms,
          Navigation,
          Overlays,
          Feedback,
          Data display,
          Data visualization,
          Layout,
          Marketing,
          Typography,
          Backgrounds,
          Media,
          Commerce,
          AI,
          Developer tools,
          Workflows,
        ]
    validations:
      required: true
  - type: textarea
    id: field-1
    attributes:
      label: 'Desired behavior'
    validations:
      required: true
  - type: textarea
    id: field-2
    attributes:
      label: 'Use case and visual references'
    validations:
      required: true
  - type: textarea
    id: field-3
    attributes:
      label: 'Category and preferred engine'
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Community expectations
      options:
        - label: I agree to follow the project Code of Conduct.
          required: true
